<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d3fdb" />
  <title>Stroomaansluitingen | Stad Brugge</title>

  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <link rel="stylesheet" href="./styles.css?v=12" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brugge-wordmark" aria-label="Brugge"><span>BRU</span><span>GGE</span></div>
      <div class="app-title">Stroomaansluitingen</div>
    </div>
    <button id="mobilePanelToggle" class="mobile-toggle" type="button" aria-label="Toon zijpaneel">☰</button>
  </header>

  <main class="app-shell">
    <aside id="sidePanel" class="side-panel">
      <div class="pager">
        <button id="previousFeature" class="pager-button" type="button" aria-label="Vorige aansluiting">&lt;</button>
        <span id="pagerText">0 van 0</span>
        <button id="nextFeature" class="pager-button" type="button" aria-label="Volgende aansluiting">&gt;</button>
      </div>

      <section class="details-container">
        <div id="noSelection" class="empty-card">
          <div class="empty-bolt">⚡</div>
          <div>
            <h1>Selecteer een stroomaansluiting</h1>
            <p>Klik een punt op de kaart aan om de details te bekijken.</p>
          </div>
        </div>

        <div id="featureDetails" class="feature-details is-hidden">
          <h1 id="detailTitle" class="detail-title">ID: —</h1>

          <div class="asset-card">
            <div class="asset-main">
              <span class="asset-bolt">⚡</span>
              <div class="asset-text">
                <strong>Elektrisch aansluitpunt</strong>
                <span id="assetIdLine">ID: —</span>
              </div>
            </div>
            <button id="copyDetailId" class="copy-button" type="button">⧉ Kopieer</button>
          </div>

          <div id="locationBlock" class="location-block is-hidden">
            <div class="eyebrow">📍 LOCATIE</div>
            <div id="locationPrimary" class="location-primary"></div>
            <div id="locationSecondary" class="location-secondary"></div>
          </div>

          <div id="currentBlock" class="current-card is-hidden">
            <div class="current-label">TOTALE STROOMSTERKTE</div>
            <div id="currentValue" class="current-value"></div>
          </div>

          <div id="attributesBlock" class="attributes-card is-hidden">
            <div class="attributes-head"><span>Aansluitingen</span><span>Waarde</span></div>
            <div id="attributeRows"></div>
          </div>

          <div class="details-footer"><span id="footerId">ID: —</span></div>
        </div>
      </section>
    </aside>

    <section class="map-panel">
      <arcgis-map id="map" popup-component-enabled>
        <arcgis-zoom slot="top-left"></arcgis-zoom>
        <arcgis-home slot="top-left"></arcgis-home>
        <arcgis-locate slot="top-left"></arcgis-locate>
        <arcgis-search slot="top-right"></arcgis-search>
      </arcgis-map>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=12"></script>
</body>
</html>
